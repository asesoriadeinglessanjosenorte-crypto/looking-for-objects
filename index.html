<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toddler Room Hidden Object Game</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            background: #111e2e; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Comic Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        /* Enforces strict vertical bounds so nothing gets cut off in landscape */
        #game-container {
            display: grid;
            grid-template-columns: auto 1fr auto;
            width: 98vw;
            max-width: 1200px;
            max-height: 95vh; 
            aspect-ratio: 16 / 9; 
            align-items: center;
            gap: 10px;
            background: #1a293b;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        #canvas-wrapper { 
            position: relative;
            width: 100%;
            height: 100%;
            background: #000; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid #2a3b50;
        }

        #doodleCanvas { 
            display: block; 
            width: 100%;
            height: 100%;
            object-fit: contain; 
            cursor: none;
        }

        .checklist-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            padding: 2px 0;
        }

        .checklist-item {
            position: relative;
            background: #2c3e50;
            padding: 4px;
            border-radius: 12px;
            border: 3px solid #3d566e;
            width: 60px; 
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            transition: opacity 0.3s, transform 0.2s;
        }

        .mini-img {
            max-width: 85%;
            max-height: 85%;
            width: auto;
            height: auto;
            display: block;
            filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.4));
        }

        .cross-mark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; 
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: #FF1A1A;
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
            line-height: 1;
        }

        .nav-button {
            position: absolute;
            top: 20px;
            padding: 10px 16px;
            background: rgba(44, 62, 80, 0.85);
            border: 2px solid #3d566e;
            color: white;
            border-radius: 8px;
            font-size: 22px;
            cursor: pointer; 
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }

        #winMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            font-size: 54px;
            font-weight: bold;
            color: #FF1A1A;
            text-transform: uppercase;
            text-shadow: -3px -3px 0 #FFF, 3px -3px 0 #FFF, -3px 3px 0 #FFF, 3px 3px 0 #FFF;
            display: none;
            z-index: 101;
            white-space: nowrap;
            text-align: center;
        }

        #winMessage.animate-bounce {
            display: block;
            animation: textBounce 1.5s ease-out forwards;
        }

        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            display: none;
        }

        @keyframes textBounce {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -130%) scale(1); opacity: 1; top: 30%; }
        }

        /* TARGETS PHONES IN LANDSCAPE MODE TO PREVENT SIDEBAR OVERFLOW */
        @media (max-height: 500px) and (orientation: landscape) {
            #game-container {
                gap: 6px;
                padding: 6px;
                max-height: 98vh;
            }
            .checklist-item {
                width: calc(90vh / 5 - 8px); /* Dynamically shrinks boxes to mathematically fit screen height */
                height: calc(90vh / 5 - 8px);
                border-width: 2px;
                border-radius: 8px;
                padding: 2px;
            }
            .cross-mark {
                font-size: 28px;
            }
            .nav-button {
                padding: 4px 8px;
                font-size: 16px;
                top: 8px;
            }
            #prevBtn { left: 8px; }
            #nextBtn { right: 8px; }
        }

        /* Portrait Mobile Optimization */
        @media (max-width: 768px) and (orientation: portrait) {
            #game-container {
                grid-template-columns: 45px 1fr 45px;
                gap: 4px;
                padding: 4px;
                width: 99vw;
            }
            .checklist-item {
                width: 38px;
                height: 38px;
                border-width: 2px;
                border-radius: 6px;
            }
            .cross-mark {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <button id="prevBtn" class="nav-button">&#8592;</button>
    <button id="nextBtn" class="nav-button">&#8594;</button>
    
    <div id="winMessage">You did it!</div>
    <canvas id="confettiCanvas"></canvas>

    <div id="game-container">
        <div id="left-checklist" class="checklist-container">
            <div class="checklist-item" id="item-ball">
                <img src="ball.png" alt="Ball" class="mini-img">
                <div class="cross-mark" id="cross-ball">&times;</div>
            </div>
            <div class="checklist-item" id="item-book">
                <img src="book.png" alt="Book" class="mini-img">
                <div class="cross-mark" id="cross-book">&times;</div>
            </div>
            <div class="checklist-item" id="item-flower">
                <img src="flower.png" alt="Flower" class="mini-img">
                <div class="cross-mark" id="cross-flower">&times;</div>
            </div>
            <div class="checklist-item" id="item-radio">
                <img src="radio.png" alt="Radio" class="mini-img">
                <div class="cross-mark" id="cross-radio">&times;</div>
            </div>
            <div class="checklist-item" id="item-robot">
                <img src="robot.png" alt="Robot" class="mini-img">
                <div class="cross-mark" id="cross-robot">&times;</div>
            </div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="doodleCanvas"></canvas>
        </div>

        <div id="right-checklist" class="checklist-container">
            <div class="checklist-item" id="item-beetle">
                <img src="brown beetle.png" alt="Beetle" class="mini-img">
                <div class="cross-mark" id="cross-beetle">&times;</div>
            </div>
            <div class="checklist-item" id="item-car">
                <img src="small car.png" alt="Small Car" class="mini-img">
                <div class="cross-mark" id="cross-car">&times;</div>
            </div>
            <div class="checklist-item" id="item-dino">
                <img src="T-Rex.png" alt="T-Rex" class="mini-img">
                <div class="cross-mark" id="cross-dino">&times;</div>
            </div>
            <div class="checklist-item" id="item-flashlight">
                <img src="flashlight.png" alt="Flashlight" class="mini-img">
                <div class="cross-mark" id="cross-flashlight">&times;</div>
            </div>
            <div class="checklist-item" id="item-recorder">
                <img src="recorder.png" alt="Recorder" class="mini-img">
                <div class="cross-mark" id="cross-recorder">&times;</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('doodleCanvas');
        const ctx = canvas.getContext('2d');
        const winMessage = document.getElementById('winMessage');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        
        const scene = new Image(); 
        scene.src = 'toddler room.png'; 

        let baseHoleRadius = 140;  
        let isGameOver = false;
        let confettiParticles = [];
        let lastX = 0, lastY = 0;

        const targets = [
            { id: 'car',        x: 670,  y: 378,  radius: 50, found: false },
            { id: 'flashlight', x: 1230, y: 150,  radius: 45, found: false },
            { id: 'dino',       x: 1369, y: 266,  radius: 60, found: false },
            { id: 'recorder',   x: 1527, y: 807,  radius: 50, found: false },
            { id: 'beetle',     x: 380,  y: 741,  radius: 45, found: false },
            
            { id: 'ball',       x: 987,  y: 173,  radius: 55, found: false }, 
            { id: 'book',       x: 1437, y: 106,  radius: 50, found: false }, 
            { id: 'flower',     x: 280,  y: 283,  radius: 50, found: false }, 
            { id: 'radio',      x: 130,  y: 722,  radius: 55, found: false }, 
            { id: 'robot',      x: 1084, y: 282,  radius: 50, found: false }  
        ];

        function speakExpressively(phrase) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(phrase);
            const voices = window.speechSynthesis.getVoices();
            let bestVoice = voices.find(v => v.name.includes('Google') && v.lang.startsWith('en')) || 
                            voices.find(v => v.name.includes('Natural') && v.lang.startsWith('en')) || 
                            voices.find(v => v.name.includes('Samantha') && v.lang.startsWith('en')) ||
                            voices.find(v => v.lang.startsWith('en'));
            if (bestVoice) utterance.voice = bestVoice;
            utterance.pitch = 1.35; 
            utterance.rate = 1.05;  
            window.speechSynthesis.speak(utterance);
        }

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        scene.onload = () => {
            canvas.width = 1920;
            canvas.height = 1080;
            lastX = canvas.width / 2;
            lastY = canvas.height / 2;
            draw(lastX, lastY);
        };

        function getCanvasCoordinates(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        function checkClickOrTap(clientX, clientY) {
            if (isGameOver) return;
            const coords = getCanvasCoordinates(clientX, clientY);

            targets.forEach(target => {
                if (!target.found) {
                    const dist = Math.sqrt((coords.x - target.x)**2 + (coords.y - target.y)**2);
                    if (dist <= target.radius) {
                        target.found = true;
                        document.getElementById(`cross-${target.id}`).style.display = 'flex';
                        document.getElementById(`item-${target.id}`).style.opacity = '0.4';
                        speakExpressively("Good!");
                    }
                }
            });

            if (targets.every(t => t.found)) {
                winGame();
            }
        }

        function handlePointerMove(clientX, clientY) {
            if (isGameOver) return;
            const coords = getCanvasCoordinates(clientX, clientY);
            lastX = coords.x;
            lastY = coords.y;
            draw(lastX, lastY);
        }

        canvas.addEventListener('click', (e) => {
            checkClickOrTap(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            handlePointerMove(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                checkClickOrTap(e.touches[0].clientX, e.touches[0].clientY);
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        window.addEventListener('touchmove', (e) => { 
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        function winGame() {
            isGameOver = true;
            setTimeout(() => {
                speakExpressively("Wow! You did it! Outstanding job!");
            }, 500);
            winMessage.classList.add('animate-bounce');
            draw(0, 0); 
            initConfetti();
        }

        function initConfetti() {
            confettiCanvas.style.display = 'block';
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            
            const colors = ['#FF1A1A', '#FFB700', '#00D215', '#0084FF', '#DE00FF', '#00F5FF'];
            for (let i = 0; i < 150; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * confettiCanvas.height,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let remaining = false;

            confettiParticles.forEach((p) => {
                p.tiltAngle += p.tiltAngleIncremental;
                p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle);
                p.tilt = Math.sin(p.tiltAngle - confettiParticles.indexOf(p) / 3) * 15;

                if (p.y <= confettiCanvas.height) {
                    remaining = true;
                }

                confettiCtx.beginPath();
                confettiCtx.lineWidth = p.r;
                confettiCtx.strokeStyle = p.color;
                confettiCtx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                confettiCtx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                confettiCtx.stroke();
            });

            if (remaining) {
                requestAnimationFrame(animateConfetti);
            }
        }

        function draw(mx, my) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (isGameOver) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.drawImage(scene, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = '#08080c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(mx, my, baseHoleRadius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalCompositeOperation = 'destination-over';
                ctx.drawImage(scene, 0, 0, canvas.width, canvas.height);
                
                ctx.globalCompositeOperation = 'source-over';
                const gradient = ctx.createRadialGradient(mx, my, baseHoleRadius - 30, mx, my, baseHoleRadius);
                gradient.addColorStop(0, 'rgba(255, 240, 180, 0.0)');
                gradient.addColorStop(0.7, 'rgba(255, 240, 180, 0.2)');
                gradient.addColorStop(1, 'rgba(8, 8, 12, 1.0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mx, my, baseHoleRadius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        window.addEventListener('resize', () => {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            draw(lastX, lastY);
        });
    </script>
</body>
</html>
